name: Endograph Linux sandbox fork
on:
  push:
    branches: [endograph]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / /bin/true
      - run: npm ci --ignore-scripts
      - run: bun run prepare:vendor
      - run: npm run build
      - run: npm run typecheck
      - run: bun test test/sandbox/allow-read.test.ts
