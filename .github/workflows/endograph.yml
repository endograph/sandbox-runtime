name: Endograph Linux sandbox fork
on:
  push:
    branches: [endograph]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / /bin/true
      - run: npm ci --ignore-scripts
      - run: bun run prepare:vendor
      - run: npm run build
      - run: npm run typecheck
      - run: bun test test/sandbox/allow-read.test.ts test/sandbox/merged-usr.test.ts test/sandbox/symlinked-deny-paths.test.ts test/sandbox/readonly-deny-dir-stubs.test.ts test/sandbox/trailing-slash-deny-spellings.test.ts
      - run: npm pack --pack-destination /tmp
      - uses: actions/checkout@v6
        with:
          repository: endograph/endograph
          path: endograph-integration
          persist-credentials: false
      - name: Test Endograph with this runtime
        working-directory: endograph-integration
        run: |
          bun install --frozen-lockfile --ignore-scripts
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tar = fs.readdirSync("/tmp").find(f => f.startsWith("endograph-sandbox-runtime-") && f.endsWith(".tgz"));
            if (!tar) throw new Error("Runtime tarball missing");
            p.dependencies["@endograph/sandbox-runtime"] = "/tmp/" + tar;
            fs.writeFileSync("package.json", JSON.stringify(p));
          '
          bun install --ignore-scripts
          bun test test/sandbox.test.ts test/host_cli.test.ts
